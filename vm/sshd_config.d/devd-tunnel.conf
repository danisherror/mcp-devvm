# The tunnel account (doc §9.4, §11.1): it exists only to carry HTTP
# requests from the MCP server to devd's unix socket.
#
# Earlier builds used stream-local port forwarding for this, which on
# OpenSSH 9.2p1 forced `PermitOpen any` -- there is no syntax that allows
# one unix-socket path while excluding TCP destinations, so the account
# could forward to any host:port the VM could reach. That gap is closed by
# not forwarding at all:
#
#   - every kind of forwarding is off (DisableForwarding),
#   - every session runs /usr/local/bin/devd-bridge (also the account's
#     login shell), which pipes the session's stdin/stdout to devd's socket.
#
# The MCP server opens one SSH session per local connection
# (server/tunnel/manager.py). tests/integration verifies that TCP and
# stream-local forwarding are both refused for this account.
Match User devd-tunnel
    ForceCommand /usr/local/bin/devd-bridge
    DisableForwarding yes
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    PermitOpen none
    PermitListen none
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    PermitUserRC no
    MaxSessions 32
