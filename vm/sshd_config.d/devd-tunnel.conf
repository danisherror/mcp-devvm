# The tunnel account is forwarding-only: no shell, no exec, no PTY (doc
# §9.4). It exists to do exactly one thing -- forward a local unix socket to
# devd's remote unix socket (§11.1) -- and nothing else.
#
# KNOWN LIMITATION, found by testing against this OpenSSH build (9.2p1,
# Debian), not assumed: the doc's illustrative config pairs `AllowTcpForwarding
# no` with stream-local forwarding, on the assumption that AllowTcpForwarding
# only governs TCP-to-TCP forwarding. Empirically, on this build,
# `AllowTcpForwarding no` blocks direct-streamlocal channel opens too --
# it behaves as a blanket forwarding kill-switch, not a TCP-only one. The
# same is true of `PermitOpen none`: it also blocks streamlocal opens, and
# there turns out to be no PermitOpen syntax on this build that permits a
# specific unix-socket path while excluding TCP destinations -- `PermitOpen
# any` is the only value that unblocks streamlocal, and it unblocks arbitrary
# TCP-to-TCP forwarding right along with it. (`PermitOpen /run/devd/devd.sock`
# outright fails to parse on this build: "PermitOpen missing host".)
#
# So this account CAN, in principle, forward to any TCP host:port reachable
# from inside the container, not just devd's socket -- a real gap versus the
# doc's intent. Mitigating factors: this container exposes no other
# meaningful listening service (devd binds a unix socket, not TCP, per
# devd/config.py), and PermitListen stays `none` so no *reverse* tunnel is
# possible either way. A production build should re-verify this exact
# behavior against its actual OpenSSH version, and should seriously consider
# the outbound-job-queue transport alternative (doc §11.4) instead, which
# sidesteps inbound-forwarding ACL granularity entirely.
Match User devd-tunnel
    ForceCommand /bin/false
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding local
    AllowTcpForwarding local
    PermitOpen any
    PermitListen none
    PermitUserRC no
