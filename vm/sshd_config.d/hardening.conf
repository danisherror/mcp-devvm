# Global sshd hardening (doc §8.3's VM-side checklist). TrustedUserCAKeys and
# AuthorizedPrincipalsFile are appended by entrypoint.sh once the CA public
# key has been provisioned into the container.
PermitRootLogin no
PasswordAuthentication no
PermitUserEnvironment no
AllowTcpForwarding no
X11Forwarding no
PermitTunnel no
AllowAgentForwarding no
# VERBOSE logs each connection's source address and the certificate used
# (to /var/log/sshd.log, see entrypoint.sh); setup_dev_vm.py reads it to
# pin the tunnel certificate's source-address.
LogLevel VERBOSE
