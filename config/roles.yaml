# user_id -> roles for the local topology (doc §9.1: the OS session
# identifies the user; this file is the policy-facing role grant on top of
# that identification). user_id is always "os:<unix-username>". Anyone not
# listed gets the "developer" role (server/auth/roles.py).
#
# Roles decide what a user may REQUEST. Who may APPROVE is decided
# separately, by which approver public keys are enrolled in the root-owned
# /etc/mcp-devvm/approvers/ (one per OS user: `approver-keys init`, then
# `sudo approver-keys enroll`).
users:
  "os:agent": [developer, tech-lead]
  # More users, e.g.:
  # "os:alice": [developer]
  # "os:bob":   [developer, tech-lead]
