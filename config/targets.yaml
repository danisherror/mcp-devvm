# Server-side only -- the agent never sees anything below `label` (doc §9.2).
# host_key is pinned by scripts/setup_dev_vm.py once the demo container is
# up. Add more VMs as more entries; the agent picks one by id via the
# `target_id` tool argument (and policy.yaml decides who can see which).
# Each target needs its own local_socket_path, and its own devd configured
# with DEVD_TARGET_ID set to the same id.
targets:
  dev-vm-01:
    label: "Dev VM (local demo)"
    ssh_host: 127.0.0.1
    ssh_port: 2222
    ssh_user: devd-tunnel
    host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGnjYjiyLEuicJW2dN7vlvOystwfJS3Pd+wHi+QybBR6"
    local_socket_path: "data/sockets/dev-vm-01.sock"
    max_concurrent_runs: 3

