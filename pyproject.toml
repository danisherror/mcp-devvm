[project]
name = "mcp-devvm"
version = "0.1.0"
description = "Secure MCP dev-VM server: typed operations, approval gate, sandboxed execution"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "asyncssh>=2.24.0",
    "cryptography>=42.0",
    "pyjwt>=2.9",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["common*", "devd*", "server*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ['.']
asyncio_mode = "auto"
