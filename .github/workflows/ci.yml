name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Unit and adversarial tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest tests/unit tests/adversarial -q

  integration:
    name: Integration tests (dev-VM container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m pip install ".[dev]"
      # --test-approvers: the tests add throwaway approver keys. Fine on a
      # disposable CI runner; never use it with an agent connected.
      - run: python scripts/setup_dev_vm.py --test-approvers
      - run: python -m pytest tests/integration -q -rs
      - name: dev-VM logs on failure
        if: failure()
        run: docker logs mcp-devvm-dev-vm 2>&1 | tail -200
